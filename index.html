<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MY TRACKS">
  <meta name="theme-color" content="#e62e5c">
  <title>自作曲プレイヤー</title>

  <!-- JSでPNGアイコンを自動生成して差し込むための枠 -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-crimson: #e62e5c;      /* メインの深紅・ローズレッド */
      --main-pink: #ff7597;         /* コーラルピンク */
      --main-light-pink: #fff0f4;   /* 背景の淡いピンク */
      --main-dark: #2b2329;         /* チャコールダーク */
      --main-gold: #f5b041;         /* アクセントのゴールド */
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--main-light-pink);
      background-image: 
        radial-gradient(var(--main-pink) 1.5px, transparent 1.5px),
        radial-gradient(var(--main-crimson) 1.5px, var(--main-light-pink) 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--main-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--main-crimson);
      border-radius: 28px;
      box-shadow: 0 12px 0 var(--main-crimson), 0 20px 30px rgba(230, 46, 92, 0.25);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, var(--main-crimson), var(--main-pink));
      color: var(--white);
      padding: 18px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 3px dashed var(--white);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    .now-playing-area {
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
    }

    .disc-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .disc-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .playing .disc-svg {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--main-crimson);
      margin-bottom: 4px;
      word-break: break-all;
    }

    .song-sub {
      font-size: 0.85rem;
      color: #887078;
      font-weight: 700;
    }

    .progress-container {
      margin: 20px 0 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      color: var(--main-crimson);
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      background: #ffd6e0;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--main-crimson);
      border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(230, 46, 92, 0.5);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 16px 0 8px;
    }

    .btn {
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-sub {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--main-light-pink);
      color: var(--main-crimson);
      border: 2px solid var(--main-pink);
      font-size: 1rem;
      font-weight: 800;
    }

    .btn-sub:hover {
      background: var(--main-pink);
      color: var(--white);
      transform: translateY(-2px);
    }

    .btn-loop {
      width: auto;
      padding: 0 12px;
      height: 38px;
      border-radius: 20px;
      font-size: 0.78rem;
      gap: 4px;
    }

    .btn-loop.active {
      background: var(--main-crimson);
      color: var(--white);
      border-color: var(--main-crimson);
      box-shadow: 0 3px 8px rgba(230, 46, 92, 0.35);
    }

    .btn-play {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--main-crimson);
      color: var(--white);
      font-size: 1.6rem;
      box-shadow: 0 5px 0 #a8183d;
    }

    .btn-play:hover {
      background: #f03866;
      transform: translateY(-2px);
    }

    .btn-play:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #a8183d;
    }

    .playlist-section {
      background: #fff7f9;
      border-top: 3px solid #ffd6e0;
      padding: 18px 20px 16px;
    }

    .playlist-header {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--main-crimson);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .track-list::-webkit-scrollbar {
      width: 6px;
    }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--main-pink);
      border-radius: 10px;
    }

    .track-item {
      background: var(--white);
      border: 2px solid #ffd6e0;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .track-item:hover {
      border-color: var(--main-pink);
      transform: translateX(4px);
    }

    .track-item.active {
      background: var(--main-crimson);
      border-color: var(--main-crimson);
      color: var(--white);
      box-shadow: 0 4px 10px rgba(230, 46, 92, 0.3);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .track-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--main-light-pink);
      color: var(--main-crimson);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .track-item.active .track-num {
      background: var(--white);
      color: var(--main-crimson);
    }

    .track-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      background: #ffe3ea;
      color: var(--main-crimson);
      flex-shrink: 0;
    }

    .track-item.active .track-badge {
      background: var(--main-gold);
      color: var(--main-dark);
    }

    .footer {
      text-align: center;
      font-size: 0.76rem;
      color: #8c6d77;
      font-weight: 700;
      padding: 12px 16px 18px;
      background: #fff7f9;
      line-height: 1.6;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="player-card" id="playerCard">
    <!-- ヘッダー -->
    <div class="header">
      <div class="site-title">🎀 MY ORIGINAL TRACKS</div>
    </div>

    <!-- プレイヤー本体 -->
    <div class="now-playing-area">
      <!-- 回転するディスクアイコン -->
      <div class="disc-wrapper">
        <svg class="disc-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="54" fill="#2B2329" stroke="#E62E5C" stroke-width="4"/>
          <circle cx="60" cy="60" r="46" fill="none" stroke="#5a4a54" stroke-width="1.5"/>
          <circle cx="60" cy="60" r="38" fill="none" stroke="#5a4a54" stroke-width="1.5"/>
          <circle cx="60" cy="60" r="30" fill="none" stroke="#5a4a54" stroke-width="1.5"/>
          <path d="M20 40 A44 44 0 0 1 40 20" stroke="#FF7597" stroke-width="4" stroke-linecap="round" fill="none"/>
          <path d="M100 80 A44 44 0 0 1 80 100" stroke="#FF7597" stroke-width="4" stroke-linecap="round" fill="none"/>
          <circle cx="60" cy="60" r="22" fill="#E62E5C"/>
          <circle cx="60" cy="60" r="22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4"/>
          <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
        </svg>
      </div>

      <div class="song-title" id="currentTitle">曲を選択してください</div>
      <div class="song-sub" id="currentMemo">STREAMING ONLY // NO DOWNLOAD</div>

      <!-- シークバー -->
      <div class="progress-container">
        <div class="time-display">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
      </div>

      <!-- 操作ボタン -->
      <div class="controls">
        <button class="btn btn-sub" id="prevBtn" title="前の曲">◀◀</button>
        <button class="btn btn-play" id="playBtn" title="再生 / 一時停止">▶</button>
        <button class="btn btn-sub" id="nextBtn" title="次の曲">▶▶</button>
        <button class="btn btn-sub btn-loop" id="loopBtn" title="ループ切替">🔁 OFF</button>
      </div>
    </div>

    <!-- プレイリスト -->
    <div class="playlist-section">
      <div class="playlist-header">🎵 TRACK LIST</div>
      <ul class="track-list" id="trackList"></ul>
    </div>

    <div class="footer">
      <div>Coding: Gemini / Claude</div>
      <div>© ゆーれい</div>
    </div>
  </div>

  <script>
    // =====================================================================
    // ★ここを書き換えるだけ★
    // 同じフォルダに入れたmp3ファイル名と、表示したい曲名・メモを記入してください
    // =====================================================================
    const SONGS = [
      {
        title: "白馬とともにいらして",
        file: "hakuba.mp3",
        memo: "BPM"
      },
      {
        title: "炭酸",
        file: "tansan.mp3",
        memo: "BPM"
      },
      {
        title: "かわいそうな僕",
        file: "kawaisou.mp3",
        memo: "BPM"
      }
      // 曲を増やすときは上の { ... }, をコピーして追加！
    ];

    // アイコン絵文字設定（ホーム画面＆ファビコン＆ロック画面アート用）
    const ICON_EMOJI = "🎀";
    const ICON_BG = "#e62e5c";
    const ARTIST_NAME = "ゆーれい";
    const ALBUM_NAME = "MY ORIGINAL TRACKS";
    // =====================================================================

    let generatedIconDataUrl = "";

    // CanvasでPNGアイコンを生成してホーム画面＆ファビコンに設定
    function generateEmojiIcons() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = ICON_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "310px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ICON_EMOJI, canvas.width / 2, canvas.height / 2 + 18);

      generatedIconDataUrl = canvas.toDataURL("image/png");
      const faviconEl = document.getElementById("dynamic-favicon");
      const appleIconEl = document.getElementById("dynamic-apple-icon");
      if (faviconEl) faviconEl.href = generatedIconDataUrl;
      if (appleIconEl) appleIconEl.href = generatedIconDataUrl;
    }

    // ★バックグラウンド再生のため、<audio>要素は1つだけを使い回し、
    //   曲切り替え時も同じ要素の src を同期的に差し替えて play() します。
    const audio = new Audio();
    audio.preload = "auto";
    audio.setAttribute("playsinline", "");

    const playerCard = document.getElementById("playerCard");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const loopBtn = document.getElementById("loopBtn");
    const seekBar = document.getElementById("seekBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationTimeEl = document.getElementById("durationTime");
    const currentTitleEl = document.getElementById("currentTitle");
    const currentMemoEl = document.getElementById("currentMemo");
    const trackListEl = document.getElementById("trackList");

    let currentIndex = 0;
    let isPlaying = false;
    let loopMode = 0; // 0:OFF 1:ALL 2:1曲

    // 右クリック・保存ショートカットのブロック
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S" || e.key === "u" || e.key === "U")) {
        e.preventDefault();
      }
    });

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // ---------- Media Session（ロック画面・通知のコントロール） ----------
    function updateMediaSession(song) {
      if (!("mediaSession" in navigator) || !song) return;

      const artwork = generatedIconDataUrl
        ? [
            { src: generatedIconDataUrl, sizes: "192x192", type: "image/png" },
            { src: generatedIconDataUrl, sizes: "512x512", type: "image/png" }
          ]
        : [];

      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: ARTIST_NAME,
        album: ALBUM_NAME,
        artwork
      });
    }

    function updatePositionState() {
      if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration,
          playbackRate: audio.playbackRate || 1,
          position: Math.min(audio.currentTime, audio.duration)
        });
      } catch (e) { /* 無視 */ }
    }

    function setupMediaSessionHandlers() {
      if (!("mediaSession" in navigator)) return;
      const set = (name, fn) => {
        try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) { /* 未対応は無視 */ }
      };

      set("play", () => playSong());
      set("pause", () => pauseSong());
      set("previoustrack", () => goPrev());
      set("nexttrack", () => goNext());
      set("seekto", d => {
        if (d && typeof d.seekTime === "number") {
          audio.currentTime = d.seekTime;
          updatePositionState();
        }
      });
      set("seekbackward", d => {
        audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 10));
      });
      set("seekforward", d => {
        audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + ((d && d.seekOffset) || 10));
      });
    }

    function renderPlaylist() {
      trackListEl.innerHTML = "";
      SONGS.forEach((song, index) => {
        const li = document.createElement("li");
        li.className = "track-item" + (index === currentIndex ? " active" : "");
        li.innerHTML = `
          <div class="track-left">
            <span class="track-num">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${song.title}</span>
          </div>
          <span class="track-badge">MP3</span>
        `;
        li.addEventListener("click", () => {
          loadSong(index, true);
        });
        trackListEl.appendChild(li);
      });
    }

    // ★同期処理にしたのがポイント。fetch等の非同期待ちを挟まないので、
    //   バックグラウンド・画面ロック中でも次の曲の play() が許可されます。
    function loadSong(index, autoPlay = false) {
      if (SONGS.length === 0) return;
      currentIndex = index;
      const song = SONGS[currentIndex];

      currentTitleEl.textContent = song.title;
      currentMemoEl.textContent = song.memo || "STREAMING ONLY";
      seekBar.value = 0;
      currentTimeEl.textContent = "00:00";
      durationTimeEl.textContent = "00:00";
      renderPlaylist();
      updateMediaSession(song);

      audio.src = song.file;
      audio.loop = (loopMode === 2);
      audio.load();

      if (autoPlay) {
        playSong();
      } else {
        pauseSong();
      }
    }

    function playSong() {
      if (!audio.src) return;
      const p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(err => {
          console.warn("再生エラー:", err);
        });
      }
    }

    function pauseSong() {
      audio.pause();
    }

    function goPrev() {
      // 3秒以上再生していたら頭出し、それ以外は前の曲
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      loadSong((currentIndex - 1 + SONGS.length) % SONGS.length, true);
    }

    function goNext() {
      loadSong((currentIndex + 1) % SONGS.length, true);
    }

    // 再生状態は audio 要素のイベントを唯一の情報源にする
    audio.addEventListener("play", () => {
      isPlaying = true;
      playBtn.textContent = "❚❚";
      playerCard.classList.add("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      playBtn.textContent = "▶";
      playerCard.classList.remove("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    });

    audio.addEventListener("error", () => {
      currentMemoEl.textContent = "※ファイル名を確認してください（サーバー上で開く必要があります）";
    });

    loopBtn.addEventListener("click", () => {
      loopMode = (loopMode + 1) % 3;
      if (loopMode === 0) {
        loopBtn.textContent = "🔁 OFF";
        loopBtn.classList.remove("active");
      } else if (loopMode === 1) {
        loopBtn.textContent = "🔁 ALL";
        loopBtn.classList.add("active");
      } else {
        loopBtn.textContent = "🔂 1曲";
        loopBtn.classList.add("active");
      }
      // 1曲ループはブラウザ標準のloopに任せる（バックグラウンドでも確実）
      audio.loop = (loopMode === 2);
    });

    playBtn.addEventListener("click", () => {
      if (isPlaying) pauseSong();
      else playSong();
    });

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    audio.addEventListener("loadedmetadata", () => {
      durationTimeEl.textContent = formatTime(audio.duration);
      updatePositionState();
    });

    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    // ★曲の終了時：同期的に次の曲へ切り替えて再生（背景でも途切れない）
    audio.addEventListener("ended", () => {
      if (loopMode === 2) {
        audio.currentTime = 0;
        playSong();
      } else if (loopMode === 1) {
        loadSong((currentIndex + 1) % SONGS.length, true);
      } else {
        if (currentIndex + 1 < SONGS.length) {
          loadSong(currentIndex + 1, true);
        } else {
          audio.currentTime = 0;
          pauseSong();
        }
      }
    });

    seekBar.addEventListener("input", () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
        updatePositionState();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        const actuallyPlaying = !audio.paused && !audio.ended;
        isPlaying = actuallyPlaying;
        playBtn.textContent = actuallyPlaying ? "❚❚" : "▶";
        playerCard.classList.toggle("playing", actuallyPlaying);
        updatePositionState();
      }
    });

    // 初期化
    generateEmojiIcons();
    setupMediaSessionHandlers();
    if (SONGS.length > 0) {
      loadSong(0, false);
    }
  </script>
</body>
</html>
