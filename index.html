<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="0401 STUDIO">
  <meta name="theme-color" content="#e62e5c">
  <title>0401 SOUND STUDIO // 自作曲プレイヤー</title>

  <!-- JSでPNGアイコンを自動生成して差し込むための枠 -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teto-crimson: #e62e5c;      /* イメージカラーの深紅・ローズレッド */
      --teto-pink: #ff7597;         /* 可愛いコーラルピンク */
      --teto-light-pink: #fff0f4;   /* 背景の淡いピンク */
      --teto-dark: #2b2329;         /* 軍服風のチャコールダーク */
      --teto-gold: #f5b041;         /* 装飾・フランスパンのアクセント */
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--teto-light-pink);
      background-image: 
        radial-gradient(var(--teto-pink) 1.5px, transparent 1.5px),
        radial-gradient(var(--teto-crimson) 1.5px, var(--teto-light-pink) 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--teto-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--teto-crimson);
      border-radius: 28px;
      box-shadow: 0 12px 0 var(--teto-crimson), 0 20px 30px rgba(230, 46, 92, 0.25);
      overflow: hidden;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, var(--teto-crimson), var(--teto-pink));
      color: var(--white);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px dashed var(--white);
    }

    .badge-0401 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      background: var(--teto-dark);
      color: var(--teto-pink);
      padding: 4px 12px;
      border-radius: 12px;
      border: 2px solid var(--white);
      letter-spacing: 2px;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    .now-playing-area {
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
    }

    .drill-disc-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .drill-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .playing .drill-svg {
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--teto-crimson);
      margin-bottom: 4px;
      word-break: break-all;
    }

    .song-sub {
      font-size: 0.85rem;
      color: #887078;
      font-weight: 700;
    }

    .progress-container {
      margin: 20px 0 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      color: var(--teto-crimson);
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      background: #ffd6e0;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--teto-crimson);
      border: 3px solid var(--white);
      box-shadow: 0 2px 6px rgba(230, 46, 92, 0.5);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 16px 0 8px;
    }

    .btn {
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-sub {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--teto-light-pink);
      color: var(--teto-crimson);
      border: 2px solid var(--teto-pink);
      font-size: 1rem;
      font-weight: 800;
    }

    .btn-sub:hover {
      background: var(--teto-pink);
      color: var(--white);
      transform: translateY(-2px);
    }

    .btn-loop {
      width: auto;
      padding: 0 12px;
      height: 38px;
      border-radius: 20px;
      font-size: 0.78rem;
      gap: 4px;
    }

    .btn-loop.active {
      background: var(--teto-crimson);
      color: var(--white);
      border-color: var(--teto-crimson);
      box-shadow: 0 3px 8px rgba(230, 46, 92, 0.35);
    }

    .btn-play {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--teto-crimson);
      color: var(--white);
      font-size: 1.6rem;
      box-shadow: 0 5px 0 #a8183d;
    }

    .btn-play:hover {
      background: #f03866;
      transform: translateY(-2px);
    }

    .btn-play:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #a8183d;
    }

    .playlist-section {
      background: #fff7f9;
      border-top: 3px solid #ffd6e0;
      padding: 18px 20px 16px;
    }

    .playlist-header {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--teto-crimson);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .track-list::-webkit-scrollbar {
      width: 6px;
    }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--teto-pink);
      border-radius: 10px;
    }

    .track-item {
      background: var(--white);
      border: 2px solid #ffd6e0;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .track-item:hover {
      border-color: var(--teto-pink);
      transform: translateX(4px);
    }

    .track-item.active {
      background: var(--teto-crimson);
      border-color: var(--teto-crimson);
      color: var(--white);
      box-shadow: 0 4px 10px rgba(230, 46, 92, 0.3);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .track-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--teto-light-pink);
      color: var(--teto-crimson);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .track-item.active .track-num {
      background: var(--white);
      color: var(--teto-crimson);
    }

    .track-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      background: #ffe3ea;
      color: var(--teto-crimson);
      flex-shrink: 0;
    }

    .track-item.active .track-badge {
      background: var(--teto-gold);
      color: var(--teto-dark);
    }

    .footer {
      text-align: center;
      font-size: 0.76rem;
      color: #8c6d77;
      font-weight: 700;
      padding: 12px 16px 18px;
      background: #fff7f9;
      line-height: 1.6;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="player-card" id="playerCard">
    <!-- ヘッダー -->
    <div class="header">
      <div class="site-title">🎀 MY ORIGINAL TRACKS</div>
      <div class="badge-0401">0401</div>
    </div>

    <!-- プレイヤー本体 -->
    <div class="now-playing-area">
      <!-- ドリル風スピンアイコン -->
      <div class="drill-disc-wrapper">
        <svg class="drill-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="54" fill="#FFE3EA" stroke="#E62E5C" stroke-width="4"/>
          <circle cx="60" cy="60" r="44" fill="#FFFFFF" stroke="#FF7597" stroke-width="2" stroke-dasharray="6 4"/>
          <path d="M60 16 C75 16, 82 32, 60 44 C38 32, 45 16, 60 16 Z" fill="#E62E5C"/>
          <path d="M60 104 C75 104, 82 88, 60 76 C38 88, 45 104, 60 104 Z" fill="#E62E5C"/>
          <path d="M16 60 C16 45, 32 38, 44 60 C32 82, 16 75, 16 60 Z" fill="#FF7597"/>
          <path d="M104 60 C104 45, 88 38, 76 60 C88 82, 104 75, 104 60 Z" fill="#FF7597"/>
          <circle cx="60" cy="60" r="14" fill="#2B2329" stroke="#E62E5C" stroke-width="3"/>
          <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
        </svg>
      </div>

      <div class="song-title" id="currentTitle">曲を選択してください</div>
      <div class="song-sub" id="currentMemo">STREAMING ONLY // NO DOWNLOAD</div>

      <!-- シークバー -->
      <div class="progress-container">
        <div class="time-display">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
      </div>

      <!-- 操作ボタン -->
      <div class="controls">
        <button class="btn btn-sub" id="prevBtn" title="前の曲">◀◀</button>
        <button class="btn btn-play" id="playBtn" title="再生 / 一時停止">▶</button>
        <button class="btn btn-sub" id="nextBtn" title="次の曲">▶▶</button>
        <button class="btn btn-sub btn-loop" id="loopBtn" title="ループ切替">🔁 OFF</button>
      </div>
    </div>

    <!-- プレイリスト -->
    <div class="playlist-section">
      <div class="playlist-header">🥖 TRACK LIST</div>
      <ul class="track-list" id="trackList"></ul>
    </div>

    <div class="footer">
      <div>Coding: Gemini</div>
      <div>© ゆーれい</div>
    </div>
  </div>

  <script>
    // =====================================================================
    // ★ここを書き換えるだけ★
    // 同じフォルダに入れたmp3ファイル名と、表示したい曲名・メモを記入してください
    // =====================================================================
    const SONGS = [
      {
        title: "白馬とともにいらして",
        file: "hakuba.mp3",
        memo: "BPM"
      },
      {
        title: "炭酸",
        file: "tansan.mp3",
        memo: "BPM"
      },
      {
        title: "かわいそうな僕",
        file: "kawaisou.mp3",
        memo: "BPM"
      }
      // 曲を増やすときは上の { ... }, をコピーして追加！
    ];

    // アイコン絵文字設定（ホーム画面＆ファビコン＆ロック画面アート用）
    const ICON_EMOJI = "🎀";
    const ICON_BG = "#e62e5c";
    const ARTIST_NAME = "ゆーれい";
    // =====================================================================

    let generatedIconDataUrl = "";

    // CanvasでPNGアイコンを生成してホーム画面＆ファビコンに設定
    function generateEmojiIcons() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      // 背景塗りつぶし
      ctx.fillStyle = ICON_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 絵文字描画
      ctx.font = "310px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ICON_EMOJI, canvas.width / 2, canvas.height / 2 + 18);

      generatedIconDataUrl = canvas.toDataURL("image/png");
      const faviconEl = document.getElementById("dynamic-favicon");
      const appleIconEl = document.getElementById("dynamic-apple-icon");
      if (faviconEl) faviconEl.href = generatedIconDataUrl;
      if (appleIconEl) appleIconEl.href = generatedIconDataUrl;
    }

    const audio = new Audio();
    audio.preload = "metadata";

    const playerCard = document.getElementById("playerCard");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const loopBtn = document.getElementById("loopBtn");
    const seekBar = document.getElementById("seekBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationTimeEl = document.getElementById("durationTime");
    const currentTitleEl = document.getElementById("currentTitle");
    const currentMemoEl = document.getElementById("currentMemo");
    const trackListEl = document.getElementById("trackList");

    let currentIndex = 0;
    let isPlaying = false;
    let currentBlobUrl = null;
    let loopMode = 0;

    // 右クリック・保存ショートカットのブロック
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S" || e.key === "u" || e.key === "U")) {
        e.preventDefault();
      }
    });

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // ロック画面・通知領域のメディア情報（Media Session API）を更新
    function updateMediaSession(song) {
      if (!("mediaSession" in navigator) || !song) return;

      const artwork = generatedIconDataUrl
        ? [
            { src: generatedIconDataUrl, sizes: "192x192", type: "image/png" },
            { src: generatedIconDataUrl, sizes: "512x512", type: "image/png" }
          ]
        : [];

      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: ARTIST_NAME,
        album: "0401 SOUND STUDIO",
        artwork
      });

      navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
    }

    function setupMediaSessionHandlers() {
      if (!("mediaSession" in navigator)) return;

      navigator.mediaSession.setActionHandler("play", () => {
        playSong();
      });
      navigator.mediaSession.setActionHandler("pause", () => {
        pauseSong();
      });
      navigator.mediaSession.setActionHandler("previoustrack", () => {
        const nextIdx = (currentIndex - 1 + SONGS.length) % SONGS.length;
        loadSong(nextIdx, true);
      });
      navigator.mediaSession.setActionHandler("nexttrack", () => {
        const nextIdx = (currentIndex + 1) % SONGS.length;
        loadSong(nextIdx, true);
      });
    }

    function renderPlaylist() {
      trackListEl.innerHTML = "";
      SONGS.forEach((song, index) => {
        const li = document.createElement("li");
        li.className = "track-item" + (index === currentIndex ? " active" : "");
        li.innerHTML = `
          <div class="track-left">
            <span class="track-num">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${song.title}</span>
          </div>
          <span class="track-badge">MP3</span>
        `;
        li.addEventListener("click", () => {
          loadSong(index, true);
        });
        trackListEl.appendChild(li);
      });
    }

    async function loadSong(index, autoPlay = false) {
      if (SONGS.length === 0) return;
      currentIndex = index;
      const song = SONGS[currentIndex];

      currentTitleEl.textContent = song.title;
      currentMemoEl.textContent = "読み込み中...";
      seekBar.value = 0;
      currentTimeEl.textContent = "00:00";
      durationTimeEl.textContent = "00:00";
      renderPlaylist();
      updateMediaSession(song);

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      try {
        const response = await fetch(song.file);
        if (!response.ok) throw new Error("File not found");
        const blob = await response.blob();
        currentBlobUrl = URL.createObjectURL(blob);
        audio.src = currentBlobUrl;
        currentMemoEl.textContent = song.memo || "STREAMING ONLY";

        if (autoPlay) {
          playSong();
        } else {
          pauseSong();
        }
      } catch (err) {
        currentMemoEl.textContent = "※サーバー環境で開くかファイル名を確認してください";
        pauseSong();
      }
    }

    function playSong() {
      if (!audio.src) return;
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = "❚❚";
        playerCard.classList.add("playing");
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = "playing";
        }
      }).catch(err => {
        console.warn("再生エラー:", err);
      });
    }

    function pauseSong() {
      audio.pause();
      isPlaying = false;
      playBtn.textContent = "▶";
      playerCard.classList.remove("playing");
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }
    }

    audio.addEventListener("play", () => {
      isPlaying = true;
      playBtn.textContent = "❚❚";
      playerCard.classList.add("playing");
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "playing";
      }
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      playBtn.textContent = "▶";
      playerCard.classList.remove("playing");
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }
    });

    loopBtn.addEventListener("click", () => {
      loopMode = (loopMode + 1) % 3;
      if (loopMode === 0) {
        loopBtn.textContent = "🔁 OFF";
        loopBtn.classList.remove("active");
      } else if (loopMode === 1) {
        loopBtn.textContent = "🔁 ALL";
        loopBtn.classList.add("active");
      } else {
        loopBtn.textContent = "🔂 1曲";
        loopBtn.classList.add("active");
      }
    });

    playBtn.addEventListener("click", () => {
      if (isPlaying) pauseSong();
      else playSong();
    });

    prevBtn.addEventListener("click", () => {
      const nextIdx = (currentIndex - 1 + SONGS.length) % SONGS.length;
      loadSong(nextIdx, true);
    });

    nextBtn.addEventListener("click", () => {
      const nextIdx = (currentIndex + 1) % SONGS.length;
      loadSong(nextIdx, true);
    });

    audio.addEventListener("loadedmetadata", () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration)) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener("ended", () => {
      if (loopMode === 2) {
        audio.currentTime = 0;
        playSong();
      } else if (loopMode === 1) {
        const nextIdx = (currentIndex + 1) % SONGS.length;
        loadSong(nextIdx, true);
      } else {
        if (currentIndex + 1 < SONGS.length) {
          loadSong(currentIndex + 1, true);
        } else {
          pauseSong();
          audio.currentTime = 0;
        }
      }
    });

    seekBar.addEventListener("input", () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        const actuallyPlaying = !audio.paused && !audio.ended;
        isPlaying = actuallyPlaying;
        playBtn.textContent = actuallyPlaying ? "❚❚" : "▶";
        playerCard.classList.toggle("playing", actuallyPlaying);
      }
    });

    // 初期化
    generateEmojiIcons();
    setupMediaSessionHandlers();
    if (SONGS.length > 0) {
      loadSong(0, false);
    }
  </script>
</body>
</html>
