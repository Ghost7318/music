<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MY TRACKS">
  <meta name="theme-color" content="#4db8e8">
  <meta name="robots" content="noindex, nofollow">
  <title>自作曲プレイヤー</title>

  <!-- JSでPNGアイコンを自動生成して差し込むための枠 -->
  <link id="dynamic-favicon" rel="icon" type="image/png" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #4db8e8;          /* メインの水色 */
      --sky-deep: #2a8fc4;     /* 濃い水色（影・文字） */
      --sky-soft: #bfe6f7;     /* やわらかい水色 */
      --sky-pale: #eaf7fd;     /* 背景の淡い水色 */
      --navy: #1f3a52;         /* 制服風ネイビー */
      --chalk: #fffdf5;        /* 黒板消し・ノート風の生成り */
      --accent: #ffd86b;       /* 校舎の窓あかりのイエロー */
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;   /* 長押しメニューを出さない */
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: var(--sky-pale);
      /* ノートのような罫線 */
      background-image:
        linear-gradient(var(--sky-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--sky-soft) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 背景にふわふわ漂うおばけ */
    .floaters {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .floater {
      position: absolute;
      bottom: -60px;
      font-size: 28px;
      opacity: 0.35;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) rotate(-8deg); }
      50%  { transform: translateY(-55vh) translateX(18px) rotate(8deg); }
      100% { transform: translateY(-115vh) translateX(-10px) rotate(-8deg); }
    }

    .player-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--sky);
      border-radius: 28px;
      box-shadow: 0 12px 0 var(--sky-deep), 0 20px 30px rgba(42, 143, 196, 0.25);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .header {
      background: linear-gradient(135deg, var(--sky), #8fd8f5);
      color: var(--white);
      padding: 18px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-bottom: 3px dashed var(--white);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 0 rgba(31, 58, 82, 0.25);
    }

    .now-playing-area {
      padding: 28px 24px 20px;
      text-align: center;
      position: relative;
    }

    /* 校舎のチャイム時計＋おばけ */
    .disc-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .clock-ticks {
      transform-origin: 60px 60px;
    }

    .playing .clock-ticks {
      animation: spin 12s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .ghost-svg {
      position: relative;
      width: 62px;
      height: 62px;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(31, 58, 82, 0.25));
    }

    .playing .ghost-svg {
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(2px) rotate(-4deg); }
      50%      { transform: translateY(-6px) rotate(4deg); }
    }

    .song-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--sky-deep);
      margin-bottom: 4px;
      word-break: break-all;
    }

    .song-sub {
      font-size: 0.85rem;
      color: #6f8799;
      font-weight: 700;
    }

    .progress-container {
      margin: 20px 0 10px;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      color: var(--sky-deep);
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      background: var(--sky-soft);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--white);
      border: 3px solid var(--sky);
      box-shadow: 0 2px 6px rgba(42, 143, 196, 0.5);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 16px 0 8px;
    }

    .btn {
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-sub {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--sky-pale);
      color: var(--sky-deep);
      border: 2px solid var(--sky);
      font-size: 1rem;
      font-weight: 800;
    }

    .btn-sub:hover {
      background: var(--sky);
      color: var(--white);
      transform: translateY(-2px);
    }

    .btn-loop {
      width: auto;
      padding: 0 12px;
      height: 38px;
      border-radius: 20px;
      font-size: 0.78rem;
      gap: 4px;
    }

    .btn-loop.active {
      background: var(--sky-deep);
      color: var(--white);
      border-color: var(--sky-deep);
      box-shadow: 0 3px 8px rgba(42, 143, 196, 0.4);
    }

    .btn-play {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--sky);
      color: var(--white);
      font-size: 1.6rem;
      box-shadow: 0 5px 0 var(--sky-deep);
    }

    .btn-play:hover {
      background: #66c6f0;
      transform: translateY(-2px);
    }

    .btn-play:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--sky-deep);
    }

    .playlist-section {
      background: var(--chalk);
      border-top: 3px solid var(--sky-soft);
      padding: 18px 20px 16px;
    }

    .playlist-header {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--sky-deep);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .track-list::-webkit-scrollbar {
      width: 6px;
    }
    .track-list::-webkit-scrollbar-thumb {
      background: var(--sky);
      border-radius: 10px;
    }

    .track-item {
      background: var(--white);
      border: 2px solid var(--sky-soft);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .track-item:hover {
      border-color: var(--sky);
      transform: translateX(4px);
    }

    .track-item.active {
      background: var(--sky);
      border-color: var(--sky-deep);
      color: var(--white);
      box-shadow: 0 4px 10px rgba(42, 143, 196, 0.35);
    }

    .track-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .track-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      background: var(--sky-pale);
      color: var(--sky-deep);
      padding: 3px 8px;
      border-radius: 8px;
    }

    .track-item.active .track-num {
      background: var(--white);
      color: var(--sky-deep);
    }

    .track-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--sky-pale);
      color: var(--sky-deep);
      flex-shrink: 0;
    }

    .track-item.active .track-badge {
      background: var(--accent);
      color: var(--navy);
    }

    .footer {
      text-align: center;
      font-size: 0.76rem;
      color: #6f8799;
      font-weight: 700;
      padding: 12px 16px 18px;
      background: var(--chalk);
      line-height: 1.6;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- 背景のおばけ -->
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <div class="player-card" id="playerCard">
    <!-- ヘッダー -->
    <div class="header">
      <span>🏫</span>
      <div class="site-title">MY ORIGINAL TRACKS</div>
      <span>👻</span>
    </div>

    <!-- プレイヤー本体 -->
    <div class="now-playing-area">
      <!-- チャイム時計＋おばけ -->
      <div class="disc-wrapper">
        <svg class="clock-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="56" fill="#EAF7FD" stroke="#4DB8E8" stroke-width="4"/>
          <circle cx="60" cy="60" r="48" fill="#FFFFFF" stroke="#BFE6F7" stroke-width="2"/>
          <g class="clock-ticks" stroke="#4DB8E8" stroke-width="3" stroke-linecap="round">
            <line x1="60" y1="8" x2="60" y2="16"/>
            <line x1="112" y1="60" x2="104" y2="60"/>
            <line x1="60" y1="112" x2="60" y2="104"/>
            <line x1="8" y1="60" x2="16" y2="60"/>
            <g stroke="#BFE6F7" stroke-width="2">
              <line x1="86" y1="15" x2="82" y2="22"/>
              <line x1="105" y1="34" x2="98" y2="38"/>
              <line x1="105" y1="86" x2="98" y2="82"/>
              <line x1="86" y1="105" x2="82" y2="98"/>
              <line x1="34" y1="105" x2="38" y2="98"/>
              <line x1="15" y1="86" x2="22" y2="82"/>
              <line x1="15" y1="34" x2="22" y2="38"/>
              <line x1="34" y1="15" x2="38" y2="22"/>
            </g>
          </g>
        </svg>

        <!-- おばけ -->
        <svg class="ghost-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 8 C28 8 16 25 16 46 L16 88 C16 92 20 93 23 90 L32 82 L41 91 C44 94 47 94 50 91 L59 82 L68 91 C71 94 74 93 77 90 L84 84 C84 84 84 70 84 46 C84 25 72 8 50 8 Z"
                fill="#FFFFFF" stroke="#2A8FC4" stroke-width="4" stroke-linejoin="round"/>
          <ellipse cx="38" cy="44" rx="5" ry="7" fill="#1F3A52"/>
          <ellipse cx="62" cy="44" rx="5" ry="7" fill="#1F3A52"/>
          <ellipse cx="30" cy="56" rx="5" ry="3" fill="#8FD8F5" opacity="0.8"/>
          <ellipse cx="70" cy="56" rx="5" ry="3" fill="#8FD8F5" opacity="0.8"/>
          <path d="M44 58 Q50 64 56 58" stroke="#1F3A52" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="song-title" id="currentTitle">曲を選択してください</div>
      <div class="song-sub" id="currentMemo">STREAMING ONLY // NO DOWNLOAD</div>

      <!-- シークバー -->
      <div class="progress-container">
        <div class="time-display">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
      </div>

      <!-- 操作ボタン -->
      <div class="controls">
        <button class="btn btn-sub" id="prevBtn" title="前の曲">◀◀</button>
        <button class="btn btn-play" id="playBtn" title="再生 / 一時停止">▶</button>
        <button class="btn btn-sub" id="nextBtn" title="次の曲">▶▶</button>
        <button class="btn btn-sub btn-loop" id="loopBtn" title="ループ切替">🔁 OFF</button>
      </div>
    </div>

    <!-- プレイリスト -->
    <div class="playlist-section">
      <div class="playlist-header">🏫 TRACK LIST</div>
      <ul class="track-list" id="trackList"></ul>
    </div>

    <div class="footer">
      <div>Coding: Gemini / Claude</div>
    </div>
  </div>

  <script>
    // =====================================================================
    // ★ここを書き換えるだけ★
    // 同じフォルダに入れたmp3ファイル名と、表示したい曲名・メモを記入してください
    // =====================================================================
    const SONGS = [
      {
        title: "白馬とともにいらして",
        file: "hakuba.mp3",
        memo: "重音テト"
      },
      {
        title: "炭酸",
        file: "tansan.mp3",
        memo: "重音テト"
      },
      {
        title: "かわいそうな僕",
        file: "kawaisou.mp3",
        memo: "重音テト"
      }
      // 曲を増やすときは上の { ... }, をコピーして追加！
    ];

    // アイコン絵文字設定（ホーム画面＆ファビコン＆ロック画面アート用）
    const ICON_EMOJI = "👻";
    const ICON_BG = "#4db8e8";
    const ARTIST_NAME = "重音テト";
    const ALBUM_NAME = "MY ORIGINAL TRACKS";
    // =====================================================================

    let generatedIconDataUrl = "";

    // CanvasでPNGアイコンを生成してホーム画面＆ファビコンに設定
    function generateEmojiIcons() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = ICON_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = "310px 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(ICON_EMOJI, canvas.width / 2, canvas.height / 2 + 18);

      generatedIconDataUrl = canvas.toDataURL("image/png");
      const faviconEl = document.getElementById("dynamic-favicon");
      const appleIconEl = document.getElementById("dynamic-apple-icon");
      if (faviconEl) faviconEl.href = generatedIconDataUrl;
      if (appleIconEl) appleIconEl.href = generatedIconDataUrl;
    }

    // 背景の漂うおばけ・校舎を生成
    function spawnFloaters() {
      const wrap = document.getElementById("floaters");
      if (!wrap) return;
      const emojis = ["👻", "🏫", "👻", "☁️", "👻"];
      for (let i = 0; i < 9; i++) {
        const el = document.createElement("span");
        el.className = "floater";
        el.textContent = emojis[i % emojis.length];
        el.style.left = (5 + Math.random() * 90) + "%";
        el.style.fontSize = (20 + Math.random() * 22) + "px";
        el.style.animationDuration = (18 + Math.random() * 18) + "s";
        el.style.animationDelay = (-Math.random() * 30) + "s";
        wrap.appendChild(el);
      }
    }

    // =====================================================================
    // ★途切れ対策：<audio>を2つ用意（ダブルバッファ）
    //   再生中は「次の曲」をもう片方に先読みしておき、曲が終わった瞬間に
    //   同期的に切り替えます。通信待ち・読み込み待ちが無いので、
    //   バックグラウンド・画面ロック中でも途切れにくくなります。
    // =====================================================================
    const players = [new Audio(), new Audio()];
    players.forEach(p => {
      p.preload = "auto";
      p.setAttribute("playsinline", "");
      p.setAttribute("controlsList", "nodownload");
    });
    let activeIdx = 0;
    const getActive = () => players[activeIdx];
    const getIdle = () => players[1 - activeIdx];

    const playerCard = document.getElementById("playerCard");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const loopBtn = document.getElementById("loopBtn");
    const seekBar = document.getElementById("seekBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationTimeEl = document.getElementById("durationTime");
    const currentTitleEl = document.getElementById("currentTitle");
    const currentMemoEl = document.getElementById("currentMemo");
    const trackListEl = document.getElementById("trackList");

    let currentIndex = 0;
    let preparedIndex = null;   // 待機側プレイヤーに先読み済みの曲番号
    let isPlaying = false;
    let loopMode = 0;           // 0:OFF 1:ALL 2:1曲
    let unlocked = false;       // 待機側プレイヤーの再生許可を取得済みか

    // ---------- 見た目上の保存防止 ----------
    ["contextmenu", "dragstart", "selectstart", "copy", "cut"].forEach(evt => {
      document.addEventListener(evt, e => e.preventDefault());
    });
    document.addEventListener("keydown", e => {
      const k = (e.key || "").toLowerCase();
      const mod = e.ctrlKey || e.metaKey;
      if (
        e.key === "F12" ||
        (mod && ["s", "u", "p", "a"].includes(k)) ||
        (mod && e.shiftKey && ["i", "j", "c"].includes(k)) ||
        (e.metaKey && e.altKey && ["i", "j", "c", "u"].includes(k))
      ) {
        e.preventDefault();
      }
    });

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // ---------- Media Session（ロック画面・通知のコントロール） ----------
    function updateMediaSession(song) {
      if (!("mediaSession" in navigator) || !song) return;

      const artwork = generatedIconDataUrl
        ? [
            { src: generatedIconDataUrl, sizes: "192x192", type: "image/png" },
            { src: generatedIconDataUrl, sizes: "512x512", type: "image/png" }
          ]
        : [];

      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: ARTIST_NAME,
        album: ALBUM_NAME,
        artwork
      });
    }

    function updatePositionState() {
      if (!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
      const a = getActive();
      if (!isFinite(a.duration) || a.duration <= 0) return;
      try {
        navigator.mediaSession.setPositionState({
          duration: a.duration,
          playbackRate: a.playbackRate || 1,
          position: Math.min(a.currentTime, a.duration)
        });
      } catch (e) { /* 無視 */ }
    }

    function setupMediaSessionHandlers() {
      if (!("mediaSession" in navigator)) return;
      const set = (name, fn) => {
        try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) { /* 未対応は無視 */ }
      };

      set("play", () => playSong());
      set("pause", () => pauseSong());
      set("previoustrack", () => goPrev());
      set("nexttrack", () => goNext());
      set("seekto", d => {
        if (d && typeof d.seekTime === "number") {
          getActive().currentTime = d.seekTime;
          updatePositionState();
        }
      });
      set("seekbackward", d => {
        const a = getActive();
        a.currentTime = Math.max(0, a.currentTime - ((d && d.seekOffset) || 10));
      });
      set("seekforward", d => {
        const a = getActive();
        a.currentTime = Math.min(a.duration || Infinity, a.currentTime + ((d && d.seekOffset) || 10));
      });
    }

    function renderPlaylist() {
      trackListEl.innerHTML = "";
      SONGS.forEach((song, index) => {
        const li = document.createElement("li");
        li.className = "track-item" + (index === currentIndex ? " active" : "");
        li.innerHTML = `
          <div class="track-left">
            <span class="track-num">${String(index + 1).padStart(2, "0")}</span>
            <span class="track-name">${song.title}</span>
          </div>
          <span class="track-badge">MP3</span>
        `;
        li.addEventListener("click", () => {
          unlockIdlePlayer();
          switchTo(index, true);
        });
        trackListEl.appendChild(li);
      });
    }

    // ---------- 次の曲の先読み ----------
    function nextIndexAfter(i) {
      if (SONGS.length === 0) return -1;
      if (loopMode === 0 && i + 1 >= SONGS.length) return -1; // OFFの最終曲は次なし
      return (i + 1) % SONGS.length;
    }

    function prepareNext() {
      const idle = getIdle();
      const next = nextIndexAfter(currentIndex);
      if (next < 0 || SONGS.length < 2) {
        preparedIndex = null;
        return;
      }
      if (preparedIndex === next) return;
      idle.pause();
      idle.src = SONGS[next].file;
      idle.loop = false;
      idle.load();
      preparedIndex = next;
    }

    // スマホは「ユーザー操作で一度再生したプレイヤー」しか
    // バックグラウンドで自動再生できないことがあるため、
    // 最初のタップ時に待機側も無音で一度だけ再生許可を取っておく
    function unlockIdlePlayer() {
      if (unlocked) return;
      unlocked = true;
      const idle = getIdle();
      if (!idle.src) return;
      idle.muted = true;
      const p = idle.play();
      const restore = () => {
        idle.pause();
        try { idle.currentTime = 0; } catch (e) {}
        idle.muted = false;
      };
      if (p && typeof p.then === "function") {
        p.then(restore).catch(() => { idle.muted = false; });
      } else {
        restore();
      }
    }

    // ---------- 曲の切り替え（すべて同期処理） ----------
    function switchTo(index, autoPlay) {
      if (SONGS.length === 0) return;
      const song = SONGS[index];
      const old = getActive();
      let el;

      if (preparedIndex === index) {
        // 先読み済みの待機側へ切り替え
        activeIdx = 1 - activeIdx;
        el = getActive();
        try { el.currentTime = 0; } catch (e) {}
      } else {
        el = old;
        el.src = song.file;
        el.load();
      }

      if (el !== old) old.pause();

      el.muted = false;
      el.loop = (loopMode === 2);
      currentIndex = index;
      preparedIndex = null;

      currentTitleEl.textContent = song.title;
      currentMemoEl.textContent = song.memo || "STREAMING ONLY";
      seekBar.value = 0;
      currentTimeEl.textContent = "00:00";
      durationTimeEl.textContent = formatTime(el.duration);
      renderPlaylist();
      updateMediaSession(song);

      if (autoPlay) {
        const p = el.play();
        if (p && typeof p.catch === "function") {
          p.catch(err => console.warn("再生エラー:", err));
        }
      } else {
        el.pause();
      }

      prepareNext();
    }

    function playSong() {
      const a = getActive();
      if (!a.src) return;
      unlockIdlePlayer();
      const p = a.play();
      if (p && typeof p.catch === "function") {
        p.catch(err => console.warn("再生エラー:", err));
      }
    }

    function pauseSong() {
      getActive().pause();
    }

    function goPrev() {
      // 3秒以上再生していたら頭出し、それ以外は前の曲
      if (getActive().currentTime > 3) {
        getActive().currentTime = 0;
        return;
      }
      switchTo((currentIndex - 1 + SONGS.length) % SONGS.length, true);
    }

    function goNext() {
      switchTo((currentIndex + 1) % SONGS.length, true);
    }

    // ---------- プレイヤーのイベント（アクティブ側だけ反応） ----------
    function onActive(evt, fn) {
      players.forEach(p => {
        p.addEventListener(evt, () => {
          if (p === getActive()) fn(p);
        });
      });
    }

    onActive("play", () => {
      isPlaying = true;
      playBtn.textContent = "❚❚";
      playerCard.classList.add("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    });

    onActive("pause", () => {
      isPlaying = false;
      playBtn.textContent = "▶";
      playerCard.classList.remove("playing");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    });

    onActive("error", () => {
      currentMemoEl.textContent = "※ファイル名を確認してください（サーバー上で開く必要があります）";
    });

    onActive("loadedmetadata", a => {
      durationTimeEl.textContent = formatTime(a.duration);
      updatePositionState();
    });

    onActive("timeupdate", a => {
      if (!isNaN(a.duration) && a.duration > 0) {
        seekBar.value = (a.currentTime / a.duration) * 100;
        currentTimeEl.textContent = formatTime(a.currentTime);
      }
    });

    // ★曲の終了時：先読み済みのプレイヤーへ即切り替えて再生
    onActive("ended", a => {
      if (loopMode === 2) {
        a.currentTime = 0;
        a.play().catch(() => {});
        return;
      }
      const next = nextIndexAfter(currentIndex);
      if (next >= 0) {
        switchTo(next, true);
      } else {
        a.currentTime = 0;
        a.pause();
      }
    });

    // ---------- 画面の操作 ----------
    loopBtn.addEventListener("click", () => {
      loopMode = (loopMode + 1) % 3;
      if (loopMode === 0) {
        loopBtn.textContent = "🔁 OFF";
        loopBtn.classList.remove("active");
      } else if (loopMode === 1) {
        loopBtn.textContent = "🔁 ALL";
        loopBtn.classList.add("active");
      } else {
        loopBtn.textContent = "🔂 1曲";
        loopBtn.classList.add("active");
      }
      // 1曲ループはブラウザ標準のloopに任せる（バックグラウンドでも確実）
      getActive().loop = (loopMode === 2);
      // ループ設定が変わったので先読みをやり直す
      preparedIndex = null;
      prepareNext();
    });

    playBtn.addEventListener("click", () => {
      if (isPlaying) pauseSong();
      else playSong();
    });

    prevBtn.addEventListener("click", () => { unlockIdlePlayer(); goPrev(); });
    nextBtn.addEventListener("click", () => { unlockIdlePlayer(); goNext(); });

    seekBar.addEventListener("input", () => {
      const a = getActive();
      if (!isNaN(a.duration)) {
        a.currentTime = (seekBar.value / 100) * a.duration;
        updatePositionState();
      }
    });

    // 画面に戻ったときに表示を実際の状態に合わせる
    function syncUi() {
      const a = getActive();
      const actuallyPlaying = !a.paused && !a.ended;
      isPlaying = actuallyPlaying;
      playBtn.textContent = actuallyPlaying ? "❚❚" : "▶";
      playerCard.classList.toggle("playing", actuallyPlaying);
      if (!isNaN(a.duration) && a.duration > 0) {
        seekBar.value = (a.currentTime / a.duration) * 100;
        currentTimeEl.textContent = formatTime(a.currentTime);
        durationTimeEl.textContent = formatTime(a.duration);
      }
      updatePositionState();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") syncUi();
    });
    window.addEventListener("pageshow", syncUi);

    // 初期化
    generateEmojiIcons();
    spawnFloaters();
    setupMediaSessionHandlers();
    renderPlaylist();
    if (SONGS.length > 0) {
      switchTo(0, false);
    }
  </script>
</body>
</html>
